<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>77-8DOC - Документы 1С</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-file-earmark-text"></i> 77-8DOC
            </span>
            <span class="navbar-text text-white">
                Документы 1С 7.7 и 1С 8
            </span>
        </div>
    </nav>

    <div class="container mt-4" x-data="app()">
        <!-- Форма фильтров -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-funnel"></i> Фильтры</h5>
            </div>
            <div class="card-body">
                <form @submit.prevent="loadDocuments">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="startDate" class="form-label">Дата начала</label>
                            <input
                                type="date"
                                class="form-control"
                                id="startDate"
                                x-model="startDate"
                                required
                            >
                        </div>
                        <div class="col-md-3">
                            <label for="endDate" class="form-label">Дата конца</label>
                            <input
                                type="date"
                                class="form-control"
                                id="endDate"
                                x-model="endDate"
                                required
                            >
                        </div>
                        <div class="col-md-4">
                            <label for="docType" class="form-label">Тип документа</label>
                            <select class="form-select" id="docType" x-model="docType">
                                <option value="realizations">Реализация товаров и услуг</option>
                                <option value="invoices">Счет-фактура выданный</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                                :disabled="loading"
                            >
                                <span x-show="!loading">
                                    <i class="bi bi-search"></i> Загрузить
                                </span>
                                <span x-show="loading">
                                    <span class="spinner-border spinner-border-sm" role="status"></span>
                                    Загрузка...
                                </span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Сообщение об ошибке -->
        <div x-show="error" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i>
            <strong>Ошибка:</strong> <span x-text="error"></span>
            <button type="button" class="btn-close" @click="error = null"></button>
        </div>

        <!-- Информация о результатах -->
        <div x-show="documents.length > 0" class="alert alert-info">
            <i class="bi bi-info-circle"></i>
            Найдено документов: <strong x-text="documents.length"></strong>
            <span class="ms-3">Общая сумма: <strong x-text="formatNumber(totalSum)"></strong> руб.</span>
        </div>

        <!-- Таблица документов -->
        <div class="card" x-show="documents.length > 0">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-table"></i>
                    <span x-text="docType === 'realizations' ? 'Реализация' : 'Счета-фактуры'"></span>
                </h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>№</th>
                                <th>Номер</th>
                                <th>Дата</th>
                                <th>Контрагент</th>
                                <th>Договор</th>
                                <th x-show="docType === 'realizations'">Склад</th>
                                <th x-show="docType === 'invoices'">Док. основание</th>
                                <th class="text-end">Сумма</th>
                                <th class="text-center">Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="(doc, index) in documents" :key="index">
                                <tr>
                                    <td x-text="index + 1"></td>
                                    <td x-text="doc.number"></td>
                                    <td x-text="doc.date"></td>
                                    <td x-text="doc.contractor"></td>
                                    <td x-text="doc.contract"></td>
                                    <td x-show="docType === 'realizations'" x-text="doc.warehouse"></td>
                                    <td x-show="docType === 'invoices'" x-text="doc.doc_base"></td>
                                    <td class="text-end" x-text="formatNumber(doc.sum)"></td>
                                    <td class="text-center">
                                        <button
                                            class="btn btn-sm btn-outline-primary"
                                            @click="showDetails(doc)"
                                            title="Показать табличную часть"
                                        >
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Пустое состояние -->
        <div x-show="!loading && documents.length === 0 && !error" class="text-center py-5">
            <i class="bi bi-inbox" style="font-size: 4rem; color: #ccc;"></i>
            <p class="text-muted mt-3">Выберите период и нажмите "Загрузить"</p>
        </div>

        <!-- Модальное окно с деталями документа -->
        <div class="modal fade" id="detailsModal" tabindex="-1">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="bi bi-file-earmark-text"></i>
                            Документ № <span x-text="selectedDoc?.number"></span> от <span x-text="selectedDoc?.date"></span>
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Шапка документа -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Контрагент:</strong> <span x-text="selectedDoc?.contractor"></span>
                            </div>
                            <div class="col-md-6">
                                <strong>Договор:</strong> <span x-text="selectedDoc?.contract"></span>
                            </div>
                        </div>
                        <div class="row mb-3" x-show="docType === 'realizations'">
                            <div class="col-md-6">
                                <strong>Склад:</strong> <span x-text="selectedDoc?.warehouse"></span>
                            </div>
                            <div class="col-md-6">
                                <strong>Валюта:</strong> <span x-text="selectedDoc?.currency"></span>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Сумма:</strong> <span x-text="formatNumber(selectedDoc?.sum)"></span> руб.
                            </div>
                        </div>

                        <hr>

                        <!-- Табличная часть -->
                        <h6><i class="bi bi-list-ul"></i> Табличная часть</h6>
                        <div class="table-responsive">
                            <table class="table table-sm table-bordered">
                                <thead class="table-light">
                                    <tr>
                                        <th>№</th>
                                        <template x-for="(value, key) in selectedDoc?.table_part[0]" :key="key">
                                            <th x-text="key"></th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(row, index) in selectedDoc?.table_part" :key="index">
                                        <tr>
                                            <td x-text="index + 1"></td>
                                            <template x-for="(value, key) in row" :key="key">
                                                <td x-text="value"></td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App JS -->
    <script src="/static/js/app.js"></script>
</body>
</html>
